- hosts: all
  vars:
    u_names:
      - dev1
      - sudhanshu
      - qa1
      - devops1
      - ronit
      - nikhil

  tasks:
    - name: "create gfg group"
      group:
        name: gfg
        state: present

    - name: "create users"
      user:
        name: "{{ item }}"
        group: gfg
      loop: "{{ u_names }}"